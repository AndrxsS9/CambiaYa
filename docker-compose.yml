version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cambiayadb
      POSTGRES_USER: cambiya
      POSTGRES_PASSWORD: cambiya_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cambiya -d cambiayadb"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate --settings=config.settings.dev &&
             python manage.py seed_load --settings=config.settings.dev &&
             gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 120
               --access-logfile -"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: cambiayadb
      DB_USER: cambiya
      DB_PASSWORD: cambiya_pass
      DB_HOST: db
      DB_PORT: "5432"
      CONN_MAX_AGE: "60"
      USE_CLOUDINARY: "false"
      SECRET_KEY: "dev-secret-key-change-in-prod"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Constrained container — for the load-test comparison
  web_limited:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    command: >
      sh -c "gunicorn config.wsgi:application
               --bind 0.0.0.0:8000
               --workers 2
               --timeout 120
               --access-logfile -"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: cambiayadb
      DB_USER: cambiya
      DB_PASSWORD: cambiya_pass
      DB_HOST: db
      DB_PORT: "5432"
      CONN_MAX_AGE: "60"
      USE_CLOUDINARY: "false"
      SECRET_KEY: "dev-secret-key-change-in-prod"
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  pgdata:
